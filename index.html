
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f15b22">
<title>IcEfOzxy Topup Status</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#fff8f1;color:#38251c;
 font-family:Prompt,sans-serif;padding:24px 15px;
}
.container{max-width:520px;margin:auto}
header{text-align:center;margin:25px 0 30px}
.logo{font-size:48px}
h1{font-size:25px;color:#ed6028;margin:5px}
.subtitle{color:#987e70;font-size:13px}
.card{
 background:white;border-radius:18px;padding:20px;
 margin:16px 0;box-shadow:0 5px 20px #0000000a;
}
.section-title{font-weight:700;margin-bottom:14px}
.status-bar{
 width:100%;border:0;border-radius:12px;
 padding:17px;color:white;font:600 16px Prompt;
 display:flex;justify-content:space-between;
 align-items:center;cursor:pointer;text-align:left;
}
.green{background:#159653}
.yellow{background:#e7a51a}
.red{background:#dc3b3b}
.gray{background:#858585}
.details{
 display:none;background:#fff8f1;border-radius:12px;
 padding:14px;margin-top:12px;font-size:13px;line-height:1.9;
}
.details.show{display:block}
.small{font-size:12px;color:#987e70}
footer{text-align:center;color:#a28c7d;font-size:12px;margin:30px 0}
button:focus-visible{outline:3px solid #f15b22}
</style>
</head>
<body>
<div class="container">
<header>
 <div class="logo">🦊</div>
 <h1>IcEfOzxy Topup</h1>
 <div class="subtitle">SYSTEM STATUS & BUSINESS HOURS</div>
</header>

<div class="card">
 <div class="section-title">🌐 IcEfOzxy Topup Website</div>
 <button id="websiteBar" class="status-bar gray">
  <span id="websiteLabel">⚪ กำลังตรวจสอบ...</span>
  <span>›</span>
 </button>
 <div id="websiteDetails" class="details">
  กำลังตรวจสอบเว็บไซต์...
 </div>
 <p class="small" id="lastCheck">ยังไม่มีข้อมูลการตรวจสอบ</p>
</div>

<div class="card">
 <div class="section-title">🕒 IcEfOzxy Topup Time</div>
 <button id="timeBar" class="status-bar gray">
  <span id="timeLabel">กำลังตรวจสอบเวลา...</span>
  <span>›</span>
 </button>
 <div id="timeDetails" class="details">
  กำลังคำนวณเวลาทำการ...
 </div>
 <p class="small">เวลาทำการ: เสาร์–อาทิตย์ 10:00–19:00 น.</p>
</div>

<footer>
 © 2026 IcEfOzxy Topup<br>
 Angely Foxy Topup 🦊
</footer>
</div>

<script>
const SITE =
 "https://icefozxytopup.github.io/IcEfOzxy-TopupSHOP/";

const $ = id => document.getElementById(id);

function toggleDetails(id){
 $(id).classList.toggle("show");
}

$("websiteBar").onclick = () => toggleDetails("websiteDetails");
$("timeBar").onclick = () => toggleDetails("timeDetails");

async function checkWebsite(){
 const bar = $("websiteBar");
 const label = $("websiteLabel");
 const details = $("websiteDetails");
 const last = $("lastCheck");

 bar.className = "status-bar gray";
 label.textContent = "⚪ กำลังตรวจสอบ...";
 details.innerHTML = "กำลังส่งคำขอตรวจสอบเว็บไซต์...";

 const start = Date.now();
 const timeout = new Promise((_,reject) =>
  setTimeout(() => reject(new Error("timeout")),10000)
 );

 try{
  // ใช้บริการ proxy เพื่ออ่านผลจากเว็บไซต์ข้ามโดเมน
  const request = fetch(
   "https://api.allorigins.win/raw?url=" +
   encodeURIComponent(SITE) +
   "&t=" + Date.now(),
   {cache:"no-store"}
  );

  const response = await Promise.race([request,timeout]);
  if(!response.ok) throw new Error("proxy-error");

  const html = await response.text();
  if(!html || html.length < 50) throw new Error("empty-response");

  const seconds = ((Date.now()-start)/1000).toFixed(2);

  bar.className = "status-bar green";
  label.textContent = "🟢 ใช้งานได้";
  details.innerHTML =
   "สถานะ: เว็บไซต์ตอบกลับแล้ว<br>" +
   "เวลาตอบสนอง: "+seconds+" วินาที<br>" +
   "ที่อยู่เว็บไซต์: "+SITE+"<br>" +
   "ผลตรวจนี้ยืนยันการตอบกลับผ่านบริการตรวจสอบ ไม่ใช่การรับประกันว่าทุกฟังก์ชันทำงานปกติ";

  last.textContent = "ตรวจสอบล่าสุด: "+new Date().toLocaleTimeString("th-TH");

  if(Number(seconds)>2.5){
   bar.className = "status-bar yellow";
   label.textContent = "🟡 ตอบสนองช้า";
   details.innerHTML += "<br>เว็บไซต์ตอบกลับช้ากว่าปกติ";
  }

 }catch(error){
  bar.className = "status-bar red";
  label.textContent = "🔴 ตรวจสอบไม่สำเร็จ";
  details.innerHTML =
   "ไม่สามารถยืนยันการเข้าถึงเว็บไซต์ได้<br>" +
   "สาเหตุอาจมาจากเว็บไซต์หรือบริการตรวจสอบขัดข้อง<br>" +
   "เวลาที่กลับมาใช้งาน: ยังไม่สามารถคาดการณ์ได้<br>" +
   "แนะนำให้ลองตรวจสอบอีกครั้ง";
  last.textContent = "ตรวจสอบล่าสุด: "+new Date().toLocaleTimeString("th-TH");
 }
}

function checkTime(){
 const now = new Date();
 const day = now.getDay();
 const hour = now.getHours();
 const minute = now.getMinutes();
 const current = hour*60+minute;

 const opens = day===6 || day===0;
 const start = 10*60;
 const end = 19*60;

 let status, label, message;

 if(!opens || current<start || current>=end){
  status="red";
  label="🔴 ปิดทำการ";
  message = !opens
   ? "วันนี้ไม่ใช่วันทำการ (เปิดเฉพาะวันเสาร์และวันอาทิตย์)"
   : current<start
    ? "ร้านจะเปิดเวลา 10:00 น."
    : "ร้านปิดทำการแล้ววันนี้";
 }else if(current>=18*60){
  status="yellow";
  label="🟡 ใกล้ปิด";
  const remaining=end-current;
  message="เหลือเวลาทำการอีก "+Math.floor(remaining/60)+
   " ชั่วโมง "+(remaining%60)+" นาที";
 }else{
  status="green";
  label="🟢 เปิดทำการ";
  const remaining=end-current;
  message="ร้านกำลังเปิดให้บริการ<br>เหลือเวลาทำการอีก "+
   Math.floor(remaining/60)+" ชั่วโมง "+(remaining%60)+" นาที";
 }

 $("timeBar").className="status-bar "+status;
 $("timeLabel").textContent=label;
 $("timeDetails").innerHTML=
  message+"<br>เวลาปัจจุบัน: "+
  now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+
  "<br>วัน: "+now.toLocaleDateString("th-TH",{weekday:"long"});
}

checkWebsite();
checkTime();
setInterval(checkWebsite,60000);
setInterval(checkTime,10000);
</script>
</body>
</html>
